# The path to the base model's checkpoint directory to load for finetuning. (type: <class 'Path'>, default: checkpoints/stabilityai/stablelm-base-alpha-3b)
checkpoint_dir: checkpoints/google/functiongemma-270m-it

# Directory in which to save checkpoints and logs. (type: <class 'Path'>, default: out/lora)
out_dir: out/finetune/full-functiongemma-270m

# The precision to use for finetuning. Possible choices: "bf16-true", "bf16-mixed", "32-true". (type: Optional[str], default: null)
precision: bf16-true

# How many devices/GPUs to use. (type: Union[int, str], default: 1)
devices: 1

# How many nodes to use. (type: int, default: 1)
num_nodes: 1

# Data-related arguments. If not provided, the default is ``litgpt.data.Alpaca``.
data:
  class_path: litgpt.data.Alpaca2k
  init_args:
    mask_prompt: false
    val_split_fraction: 0.03847
    prompt_style: functiongemma
    ignore_index: -100
    seed: 42
    num_workers: 4

# Training-related arguments. See ``litgpt.args.TrainArgs`` for details
train:
  # Number of optimizer steps between saving checkpoints (type: Optional[int], default: 1000)
  save_interval: 1000

  # Number of iterations between logging calls (type: int, default: 1)
  log_interval: 1

  # Number of samples between optimizer steps across data-parallel ranks (type: int, default: 128)
  global_batch_size: 16

  # Number of samples per data-parallel rank (type: int, default: 4)
  micro_batch_size: 4

  # Number of iterations with learning rate warmup active (type: int, default: 100)
  lr_warmup_steps: 10

  # Number of epochs to train on (type: Optional[int], default: 5)
  epochs: 1

  # Total number of tokens to train on (type: Optional[int], default: null)
  max_tokens:

  # Limits the number of optimizer steps to run. (type: Optional[int], default: null)
  max_steps: 1000

  # Learning rate to use for training. (type: float, default: 0.0003)
  learning_rate: 2.0e-4

  # Minimum learning rate, useful for cosine annealing. (type: float, default: 6e-5)
  min_lr: 6.0e-5

  # Type of learning rate scheduler. (type: Optional[str], default: null)
  lr_scheduler: cosine_with_warmup

  # Weight decay to use for training. (type: float, default: 0.01)
  weight_decay: 0.01

  # Maximum gradient norm for clipping. (type: float, default: 1.0)
  max_norm: 1.0

  # Tie the embedding weights with the language modeling head. (type: bool, default: true)
  tie_embeddings: true

  # Seed for reproducibility. (type: int, default: 42)
  seed: 42
